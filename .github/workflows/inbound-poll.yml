name: Inbound Connector Poll

# Polls the live inbound connectors (Salesforce, Gong) on an interval, per
# 10-OPTIMIZATION-NOTES.md (a 15–30 min interval is a reasonable default;
# tune to actual signal frequency). Crayon is intentionally NOT polled here —
# prefer its outbound webhook (/api/connectors/crayon/webhook) when available.
#
# Only connectors in Live Mode do real work; a Test-Mode connector's fetch
# would re-read the fixture, so this workflow should only be enabled once a
# connector is actually switched to Live.

on:
  # Scheduled runs are DISABLED — this app is not deployed, so the cron runs
  # would only fail. Re-enable by uncommenting when APP_URL/CRON_SECRET are set.
  # schedule:
  #   - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch: {} # manual runs only, from the Actions tab

jobs:
  poll:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        connector: [salesforce, gong]
    steps:
      - name: Poll ${{ matrix.connector }}
        run: |
          echo "Polling ${{ matrix.connector }}…"
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST "${APP_URL}/api/connectors/${{ matrix.connector }}/fetch" \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.json
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Poll failed for ${{ matrix.connector }}."
            exit 1
          fi
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
