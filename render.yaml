# Render Blueprint for Compete Agent (Next.js Web Service).
# Deploy: Render Dashboard → New + → Blueprint → pick this repo → set the env
# var values when prompted (sync:false vars are entered in the dashboard, never
# committed). APP_URL must be the Render URL of THIS service (set it after the
# first deploy gives you the URL, then redeploy).
services:
  - type: web
    name: compete-agent
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "20"
      # --- Supabase (required) ---
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # --- AI provider: Litera's Entra gateway is the production backend ---
      - key: LITERA_API_URL
        sync: false
      - key: LITERA_MODEL
        sync: false
      # Entra audience for the gateway. Has a sensible default in code; set it
      # here only if the gateway's audience changes.
      - key: LITERA_TOKEN_RESOURCE
        sync: false
      # Token refresh. On a server there is nobody to sign in, so the app must
      # authenticate as itself: these three let it request and renew its own
      # token. Without them it falls back to LITERA_API_TOKEN, which expires
      # after an hour and will not survive a scheduled run.
      - key: LITERA_TENANT_ID
        sync: false
      - key: LITERA_CLIENT_ID
        sync: false
      - key: LITERA_CLIENT_SECRET
        sync: false
      # Manual fallback only, for a deploy made before the credentials exist.
      - key: LITERA_API_TOKEN
        sync: false
      # --- Optional second backend, reached only if Litera is unavailable ---
      - key: GEMINI_ENTRA_URL
        sync: false
      - key: GEMINI_ENTRA_MODEL
        sync: false
      # --- Email (Brevo) + PMM notification ---
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: PMM_NOTIFY_EMAIL
        sync: false
      # --- App URL (set to the Render service URL) ---
      - key: APP_URL
        sync: false
      # --- Scheduled-job + connector secrets ---
      - key: CRON_SECRET
        sync: false
      - key: CRAYON_WEBHOOK_SECRET
        sync: false
      - key: CRAYON_API_KEY
        sync: false
